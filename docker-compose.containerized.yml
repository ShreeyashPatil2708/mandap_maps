# Docker Compose for local development with all three services containerized
# This complements the existing docker-compose.yml (which only has Postgres + Redis)
# Usage: docker compose -f docker-compose.containerized.yml up --build

services:
  # Frontend: React/Vite built and served by nginx
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # nginx serves the SPA and proxies /api to the backend and chatbot, so the
    # app is same-origin exactly like production (see frontend/nginx.conf).
    ports:
      - "8080:80"
    depends_on:
      - backend
      - chatbot
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Backend: Node.js/Express API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    # Local containers talk to the compose Postgres directly: no Secrets
    # Manager (DB_SECRET_ID unset) and no TLS.
    environment:
      - NODE_ENV=development
      - PORT=3000
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres}
      - PGDATABASE=${PGDATABASE:-ekdantadb}
      - PGSSL=false
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://localhost:8080,http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Chatbot: Python FastAPI RAG service
  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=openai/gpt-oss-120b
      - POSTGRES_URL=postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-ekdantadb}
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_URL=http://backend:3000
      - FAISS_INDEX_PATH=/app/faiss_index/index.bin
      - FAISS_METADATA_PATH=/app/faiss_index/metadata.json
      - ALLOWED_ORIGINS=["http://localhost:8080","http://localhost:5173"]
      - INGEST_API_KEY=${INGEST_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - chatbot_faiss:/app/faiss_index

  # PostgreSQL (same as existing docker-compose.yml)
  postgres:
    image: postgres:17
    container_name: mandapmaps-postgres
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-ekdantadb}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - mandapmaps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (same as existing docker-compose.yml)
  redis:
    image: redis:7
    container_name: mandapmaps-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mandapmaps_pgdata:
  chatbot_faiss:

networks:
  default:
    name: mandapmaps-containerized