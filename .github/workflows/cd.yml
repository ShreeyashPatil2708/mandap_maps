name: CD

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy-frontend:
    name: Deploy frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build --workspace frontend
        env:
          VITE_API_BASE_URL: ""

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-backend:
    name: Deploy Node.js backend via SSM
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Node ASG via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --targets "Key=tag:aws:autoscaling:groupName,Values=mandapmaps-prod-asg-node" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "git config --global --add safe.directory /opt/mandapmaps/repo",
              "cd /opt/mandapmaps/repo",
              "git pull origin master",
              "rsync -a --delete backend/ /opt/mandapmaps/prod/",
              "cd /opt/mandapmaps/prod && npm ci --omit=dev",
              "systemctl restart mandapmaps-prod"
            ]' \
            --timeout-seconds 300 \
            --comment "Deploy ${{ github.sha }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 10
            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --region "$AWS_REGION" \
              --query 'CommandInvocations[*].Status' \
              --output text)
            echo "Status: $STATUSES"
            if echo "$STATUSES" | grep -qiE "Failed|Cancelled|TimedOut"; then
              echo "Deployment failed"
              exit 1
            fi
            if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qiE "Pending|InProgress|Delayed"; then
              echo "Deployment successful"
              exit 0
            fi
          done
          echo "Timed out waiting for SSM command"
          exit 1

  deploy-chatbot:
    name: Deploy Python chatbot via SSM
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Python ASG via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --targets "Key=tag:aws:autoscaling:groupName,Values=mandapmaps-prod-asg-python" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "git config --global --add safe.directory /opt/mandapmaps/repo",
              "cd /opt/mandapmaps/repo",
              "git pull origin master",
              "rsync -a --delete chatbot/ /opt/mandapmaps/python/",
              "pip3 install --retries 10 --timeout 120 -r /opt/mandapmaps/python/requirements.txt --quiet",
              "systemctl restart mandapmaps-chatbot"
            ]' \
            --timeout-seconds 300 \
            --comment "Deploy ${{ github.sha }}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 10
            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --region "$AWS_REGION" \
              --query 'CommandInvocations[*].Status' \
              --output text)
            echo "Status: $STATUSES"
            if echo "$STATUSES" | grep -qiE "Failed|Cancelled|TimedOut"; then
              echo "Deployment failed"
              exit 1
            fi
            if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qiE "Pending|InProgress|Delayed"; then
              echo "Deployment successful"
              exit 0
            fi
          done
          echo "Timed out waiting for SSM command"
          exit 1
