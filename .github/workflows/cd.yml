name: CD

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  CODEDEPLOY_BUCKET: ${{ secrets.CODEDEPLOY_BUCKET }}

jobs:
  deploy-frontend:
    name: Deploy frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-backend:
    name: Deploy Node.js backend via CodeDeploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package backend
        run: |
          BUNDLE_KEY="node/backend-${{ github.sha }}.zip"
          cd backend
          zip -r /tmp/backend.zip . \
            --exclude "*.env" \
            --exclude "node_modules/*" \
            --exclude ".DS_Store"
          echo "BUNDLE_KEY=$BUNDLE_KEY" >> $GITHUB_ENV

      - name: Upload bundle to S3
        run: |
          aws s3 cp /tmp/backend.zip \
            s3://${{ env.CODEDEPLOY_BUCKET }}/${{ env.BUNDLE_KEY }}

      - name: Create CodeDeploy deployment (prod)
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ secrets.NODE_CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.NODE_CODEDEPLOY_PROD_DG }} \
            --s3-location bucket=${{ env.CODEDEPLOY_BUCKET }},key=${{ env.BUNDLE_KEY }},bundleType=zip \
            --description "Deploy ${{ github.sha }}" \
            --query 'deploymentId' \
            --output text)
          echo "Deployment ID: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id $DEPLOYMENT_ID

  deploy-chatbot:
    name: Deploy Python chatbot via CodeDeploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package chatbot
        run: |
          BUNDLE_KEY="python/chatbot-${{ github.sha }}.zip"
          cd chatbot
          zip -r /tmp/chatbot.zip . \
            --exclude "*.env" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".ruff_cache/*" \
            --exclude "app/data/faiss_index/*" \
            --exclude ".DS_Store"
          echo "BUNDLE_KEY=$BUNDLE_KEY" >> $GITHUB_ENV

      - name: Upload bundle to S3
        run: |
          aws s3 cp /tmp/chatbot.zip \
            s3://${{ env.CODEDEPLOY_BUCKET }}/${{ env.BUNDLE_KEY }}

      - name: Create CodeDeploy deployment
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ secrets.PYTHON_CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.PYTHON_CODEDEPLOY_DG }} \
            --s3-location bucket=${{ env.CODEDEPLOY_BUCKET }},key=${{ env.BUNDLE_KEY }},bundleType=zip \
            --description "Deploy ${{ github.sha }}" \
            --query 'deploymentId' \
            --output text)
          echo "Deployment ID: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id $DEPLOYMENT_ID
