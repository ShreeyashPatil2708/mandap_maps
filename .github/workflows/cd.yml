name: CD

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  # Match the Terraform stack region (infra/variables.tf).
  AWS_REGION: ap-south-1

jobs:
  deploy-frontend:
    name: Deploy frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build --workspace frontend
        env:
          # Empty -> the SPA calls /api/* same-origin. Cloudflare routes /api/*
          # to the ALB and everything else to CloudFront.
          VITE_API_URL: ''

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-backend:
    name: Deploy Node API via SSM
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to API ASG via SSM
        env:
          SHA: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --targets "Key=tag:aws:autoscaling:groupName,Values=mandapmaps-api-asg" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"git config --system --add safe.directory /opt/mandapmaps/repo\",
              \"cd /opt/mandapmaps/repo\",
              \"PREV_SHA=\$(git rev-parse HEAD)\",
              \"git fetch --depth 1 origin $SHA\",
              \"git checkout --force $SHA\",
              \"npm ci --omit=dev\",
              \"sudo -u mandapmaps bash -c 'set -a; . /etc/mandapmaps/api.env; set +a; npm run migrate --workspace backend'\",
              \"systemctl restart mandapmaps-api\",
              \"PORT=\$(grep -E '^PORT=' /etc/mandapmaps/api.env | cut -d= -f2)\",
              \"ok=0; for i in \$(seq 1 20); do sleep 3; if curl -fsS http://localhost:\$PORT/ready >/dev/null 2>&1; then ok=1; break; fi; done\",
              \"if [ \$ok -ne 1 ]; then echo readiness failed - rolling back to \$PREV_SHA; git checkout --force \$PREV_SHA; npm ci --omit=dev; systemctl restart mandapmaps-api; exit 1; fi\",
              \"echo readiness-ok at $SHA\"
            ]" \
            --timeout-seconds 300 \
            --comment "Deploy $SHA" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          for i in $(seq 1 30); do
            sleep 10
            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" --region "$AWS_REGION" \
              --query 'CommandInvocations[*].Status' --output text)
            echo "Status: $STATUSES"
            if echo "$STATUSES" | grep -qiE "Failed|Cancelled|TimedOut"; then
              echo "Deployment failed"; exit 1
            fi
            if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qiE "Pending|InProgress|Delayed"; then
              echo "Deployment successful"; exit 0
            fi
          done
          echo "Timed out waiting for SSM command"; exit 1

  deploy-chatbot:
    name: Deploy Python chatbot via SSM
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to chatbot ASG via SSM
        env:
          SHA: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --targets "Key=tag:aws:autoscaling:groupName,Values=mandapmaps-chatbot-asg" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"git config --system --add safe.directory /opt/mandapmaps/repo\",
              \"cd /opt/mandapmaps/repo\",
              \"git fetch --depth 1 origin $SHA\",
              \"git checkout --force $SHA\",
              \"python3.11 -m pip install --no-cache-dir -r chatbot/requirements.txt\",
              \"systemctl restart mandapmaps-chatbot\"
            ]" \
            --timeout-seconds 600 \
            --comment "Deploy $SHA" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          for i in $(seq 1 60); do
            sleep 10
            STATUSES=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" --region "$AWS_REGION" \
              --query 'CommandInvocations[*].Status' --output text)
            # No invocations after the first ~30s means the ASG has no instances
            # (chatbot fleet scaled to 0 off-season), so there is nothing to
            # deploy. Skip cleanly instead of hanging until the timeout.
            if [ -z "$STATUSES" ]; then
              if [ "$i" -ge 3 ]; then
                echo "No chatbot instances registered (fleet scaled to 0); nothing to deploy. Skipping."
                exit 0
              fi
              continue
            fi
            echo "Status: $STATUSES"
            if echo "$STATUSES" | grep -qiE "Failed|Cancelled|TimedOut"; then
              echo "Deployment failed"; exit 1
            fi
            if ! echo "$STATUSES" | grep -qiE "Pending|InProgress|Delayed"; then
              echo "Deployment successful"; exit 0
            fi
          done
          echo "Timed out waiting for SSM command"; exit 1
