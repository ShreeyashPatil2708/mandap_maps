name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Also run as the gate at the start of the CD workflow (see cd.yml).
  workflow_call:

# Read-only token: CI only checks out and builds.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace frontend
      - run: npm run build --workspace frontend
        env:
          VITE_API_URL: ""
          # Exercise the prerender on every PR. Not strict here: if the live API
          # cannot be reached the build warns and still produces the app shell,
          # so CI never fails on something outside the change under review.
          PRERENDER_API_URL: https://mandapmaps.in

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace backend

  chatbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Match production (python3.11 on the chatbot instances).
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
        working-directory: chatbot
