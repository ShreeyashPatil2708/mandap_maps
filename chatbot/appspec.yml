version: 0.0
os: linux

files:
  - source: app
    destination: /opt/mandapmaps/python/app
    overwrite: true
  - source: requirements.txt
    destination: /opt/mandapmaps/python
    overwrite: true
  - source: systemd/mandapmaps-chatbot.service
    destination: /etc/systemd/system
    overwrite: true

permissions:
  - object: /opt/mandapmaps/python
    owner: ec2-user
    group: ec2-user
    recurse: true
    type:
      - directory
      - file
  - object: /etc/systemd/system/mandapmaps-chatbot.service
    owner: root
    group: root
    mode: '644'

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: root
  AfterInstall:
    - location: scripts/install.sh
      timeout: 600
      runas: ec2-user
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: ec2-user
