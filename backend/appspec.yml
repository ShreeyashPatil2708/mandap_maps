version: 0.0
os: linux

files:
  - source: src
    destination: /opt/mandapmaps/prod/src
    overwrite: true
  - source: package.json
    destination: /opt/mandapmaps/prod
    overwrite: true
  - source: package-lock.json
    destination: /opt/mandapmaps/prod
    overwrite: true
  - source: db
    destination: /opt/mandapmaps/prod/db
    overwrite: true
  - source: systemd/mandapmaps-prod.service
    destination: /etc/systemd/system
    overwrite: true
  - source: systemd/mandapmaps-dev.service
    destination: /etc/systemd/system
    overwrite: true

permissions:
  - object: /opt/mandapmaps/prod
    owner: ec2-user
    group: ec2-user
    recurse: true
    type:
      - directory
      - file
  - object: /etc/systemd/system/mandapmaps-prod.service
    owner: root
    group: root
    mode: '644'
  - object: /etc/systemd/system/mandapmaps-dev.service
    owner: root
    group: root
    mode: '644'

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 30
      runas: root
  AfterInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: ec2-user
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 60
      runas: ec2-user
